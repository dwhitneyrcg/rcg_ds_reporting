[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdm-merge-recommendation-engine"
version = "0.1.0"
description = "MDM merge recommendation engine for Databricks"
authors = [{name = "David Whitney", email = "dwhitney@rccl.com"}]
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.100",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
